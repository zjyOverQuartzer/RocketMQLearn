#指定端口，这里用yml文件 效果一样
server.port=8080
spring.application.name=SpringBoot_RocketMQ

# NameServer 用于发现 Broker，实际收发还需要 Broker 正常运行。
# NameServer 地址
rocketmq.name-server=127.0.0.1:9876
# 生产者组
rocketmq.producer.group=demo_producer_group
# 消息发送超时时间
rocketmq.producer.send-message-timeout=3000

# 默认仅启用基础和延时消费者。
# 按需通过启动参数启用其他演示，例如 --spring.profiles.active=tag
# SQL 演示需要 Broker 配置 enablePropertyFilter=true，然后启用 sql Profile。
